[package]
name    = "intervention-mips-nvram"
version = "0.1.0"
edition = "2021"

# Standalone; detached from the main fmst_iib_runtime workspace.
[workspace]

[lib]
crate-type = ["cdylib"]
name = "intervention_mips_nvram"

[dependencies]
fmst-iib-api = { path = "../../../../../../../GuestWeave/fmst-iib-api" }
log          = "0.4"

[build-dependencies]
serde_json = "1"

[lints.rust]
# v1 design: stub authors MUST NOT write unsafe code. The generated
# manifest export needs `#[unsafe(no_mangle)]` on modern rustc, which is
# the one sanctioned exception (explicitly `#[allow]`'d in lib.rs around
# the `include!`). Using `deny` (not `forbid`) so that the scoped allow
# is honoured.
unsafe_code = "deny"

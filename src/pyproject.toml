[project]
name = "firmenstein"
version = "0.1.0"
description = "Firmenstein - Firmware Analysis and Fuzzing Framework"
authors = [{name = "Firmenstein contributors"}]
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "aiofiles",
    "httpx==0.28.1",
    "lief", 
    "capstone>=5,<6",
    "coloredlogs",
    "loguru",
    "PyYAML",
    "docker",
    "dotenv",
    "networkx",
    "pydot",
    "grandalf",
    "jinja2",
    "rich",
    "sortedcontainers",
    "openai-codex==0.154.0",
    "claude-agent-sdk==0.2.139"
]

[project.optional-dependencies]
ida = ["ida-domain==0.5.0"]
test = ["pytest", "pytest-subtests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fmst_basic", "fmst_analyzer"]

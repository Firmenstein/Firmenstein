[pytest]
testpaths = tests src/fmst_analyzer
markers =
    external: requires a real compiler, IDA, Docker, or other external process
# The stage modules under testing/stages are CLI callbacks, not pytest tests;
# PipelineTester invokes them with an explicit tester object. The LibAFL/QEMU
# checkout under target contains upstream Python tests with their own harness.
norecursedirs =
    .git
    .venv
    src/fmst_analyzer/testing
    src/fmst_iib_runtime/target
